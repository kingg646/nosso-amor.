name: Enviar Mensagem Romântica Diária

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  enviar:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar mensagem aleatória via WhatsApp
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TO_PHONE_NUMBER: ${{ secrets.TO_PHONE_NUMBER }}
        run: |
          MESSAGES=(
              "você é a razão do meu sorriso mais sincero todos os dias. ✨"
              "seu abraço é o meu refúgio favorito no mundo inteiro. 🫂"
              "acordar sabendo que você existe deixa meu dia muito mais feliz. ☀️"
              "seu sorriso tem o poder de iluminar até os meus dias mais cinzentos. 💖"
              "obrigado por ser essa pessoa incrível que transborda amor em tudo o que faz. 🌸"
              "cada segundo ao seu lado é um presente que eu guardo no coração. ⏳"
              "você é o meu pensamento favorito logo cedo e a minha última lembrança antes de dormir. 🌙"
              "seu olhar me traz uma paz que eu nunca encontrei em nenhum outro lugar. 👀"
              "eu amo a forma como você cuida de mim e dos detalhes da nossa vida. 💞"
              "você é a melhor parte da minha rotina e de todos os nossos planos. 🗺️"
              "nem nos meus melhores sonhos eu poderia imaginar alguém tão especial quanto você. 💭"
              "sua risada é a melodia mais bonita que eu poderia ouvir. 🎶"
              "ao seu lado, eu me sinto em casa em qualquer lugar do mundo. 🏡"
              "você é a certeza bonita que a vida me deu. 🌷"
              "todo o meu amor, carinho e gratidão são inteiramente seus, hoje e sempre. ♾️"
              "você é a poesia mais linda que a vida escreveu para mim. 📖"
              "seu jeito de olhar para mim faz o tempo parar por um instante. ⏱️"
              "eu amo o seu cheiro, o seu toque e o seu jeitinho único de ser. 🌹"
              "você é a calmaria que acalma qualquer tempestade dentro de mim. 🌊"
              "dividir a vida com você é a melhor aventura que eu poderia viver. 🚀"
              "seu sorriso bobo é a coisa mais fofa do mundo. 😊"
              "você é o meu sonho mais lindo que virou realidade. ✨"
              "seu olhar me fascina e me prende de um jeito único. 👁️"
              "você é a minha paz quando tudo ao redor é barulho. 🤫"
              "seu amor me dá forças para enfrentar qualquer barreira. 🏋️"
